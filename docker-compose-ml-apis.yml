networks:
  ml_api_network:
    driver: bridge
    ipam:
      config:
        # Pinned so the NAS DSM firewall allow-rule for this subnet stays
        # valid across network recreations (see docs/ops/sidecar-model-apis.md).
        - subnet: 10.42.40.0/24

volumes:
  hf_home:
  yamnet_model_cache:

services:
  diarize-api:
    build:
      context: benchmarks/pyannote_diarization
      dockerfile: Dockerfile
    image: diarize-api:latest
    container_name: diarize-api
    restart: unless-stopped
    ports:
      # Host binding is debug-only (Airflow reaches diarize-api:8080 via
      # ml_api_network DNS); localhost-only high port avoids NAS collisions
      # with adminer (8080) and the Airflow dev webserver (8081).
      - "127.0.0.1:18080:8080"
    environment:
      HF_TOKEN: "${HF_TOKEN}"
      HF_HOME: /model-cache
      MODEL_CACHE_DIR: /model-cache
      DIARIZE_API_PORT: "8080"
      IDLE_TIMEOUT_SECONDS: "${IDLE_TIMEOUT_SECONDS:-900}"
    volumes:
      - hf_home:/model-cache
    networks:
      - ml_api_network
    mem_limit: 6g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  yamnet-api:
    build:
      context: benchmarks/yamnet_applause
      dockerfile: Dockerfile
    image: yamnet-api:latest
    container_name: yamnet-api
    restart: unless-stopped
    ports:
      # Debug-only localhost binding; see diarize-api note above.
      - "127.0.0.1:18081:8081"
    environment:
      MODEL_CACHE_DIR: /model-cache
      YAMNET_API_PORT: "8081"
      IDLE_TIMEOUT_SECONDS: "${IDLE_TIMEOUT_SECONDS:-900}"
    volumes:
      - yamnet_model_cache:/model-cache
    networks:
      - ml_api_network
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
