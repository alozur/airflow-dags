networks:
  ml_api_network:
    driver: bridge

volumes:
  hf_home:

services:
  diarize-api:
    build:
      context: benchmarks/pyannote_diarization
      dockerfile: Dockerfile
    image: diarize-api:latest
    container_name: diarize-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HF_TOKEN: "${HF_TOKEN}"
      HF_HOME: /model-cache
      MODEL_CACHE_DIR: /model-cache
      DIARIZE_API_PORT: "8080"
    volumes:
      - hf_home:/model-cache
    networks:
      - ml_api_network
    mem_limit: 6g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
