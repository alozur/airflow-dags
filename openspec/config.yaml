strict_tdd: true
context: |
  airflow-dags is a Node.js/TypeScript, Python project.
  Detected markers: pyproject.toml, GitHub Actions.
  Additional evidence: Test-like files detected (52); examples: tests/__init__.py, tests/conftest.py, tests/congress_videos/__init__.py, tests/congress_videos/config/__init__.py, tests/congress_videos/config/test_paths.py.
  Primary test command: pytest.
  Unit tests: pytest (pytest).
  Integration tests: none.
  E2E tests: none.
rules:
  proposal:
    require_problem_statement: true
  spec:
    require_acceptance_criteria: true
  design:
    require_tradeoffs: true
  tasks:
    protect_review_workload: true
  apply:
    test_command: "uv run pytest"
  verify:
    test_command: "uv run pytest"
testing:
  detected: "2026-07-23"
  runner:
    command: "uv run pytest"
    framework: "pytest"
  layers:
    unit: "uv run pytest"
    integration: ""
    e2e: "bash scripts/test-airflow-e2e.sh"
  commands:
    unit:
      - scope: "."
        command: "uv run pytest"
        framework: "pytest"
    integration:
      []
    e2e:
      - scope: "."
        command: "bash scripts/test-airflow-e2e.sh"
        framework: "docker-compose"
        gate_command: "bash scripts/dag-paths-changed.sh"
        trigger_globs:
          - "congress_videos/**"
          - "examples/**"
          - "utils/**"
          - "docker-compose*.yml"
          - "Dockerfile"
        unavailable_exit_code: 4
        notes: >
          Runs during sdd-verify only when the change diff touches one of trigger_globs
          (decided by gate_command: exit 0 = run, exit 1 = skip). Unit tests run every verify
          regardless. Docker unavailable => exit code 4 => status `unavailable` (not failed);
          any other non-zero => failed; 0 => pass. uv missing => exit 3 hard-fail.
  coverage:
    command: ""
    commands:
      []
quality:
  lint: ""
  lint_commands:
    []
  typecheck: ""
  typecheck_commands:
    []
  format: ""
  format_commands:
    []
