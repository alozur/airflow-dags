[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airflow-dags"
version = "0.1.0"
description = "Airflow DAGs for congress video processing and YouTube automation"
requires-python = ">=3.12"
dependencies = [
    # Runtime dependencies actually imported by utils/** and congress_videos/**
    # at module scope, required for both collection under pytest and the Docker
    # runtime. Union of congress_videos/requirements.txt and the
    # _PIP_ADDITIONAL_REQUIREMENTS list in docker-compose.yml's x-airflow-common
    # block, plus a few transitive gaps (psycopg2, numpy) that were previously
    # only present in the conda env with no manifest capturing them.
    # Pinned to match the production Docker runtime (Dockerfile: apache/airflow:2.11.1)
    # so local `uv run pytest` exercises the same DAG/Operator API surface as prod,
    # instead of whatever latest-2.x resolves to.
    "apache-airflow==2.11.1",
    "apache-airflow-providers-postgres",
    "psycopg2-binary",
    "numpy",
    "python-dotenv",
    "openai",
    "beautifulsoup4>=4.12.2",
    "requests>=2.31.0",
    "urllib3>=2.0.4",
    "lxml>=4.9.3",
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "google-api-python-client",
    "Pillow",
    "pypdf",
    "yt-dlp",
    "pytubefix",
    "webrtcvad-wheels>=2.0.10",
    # NOTE: openai-whisper is intentionally NOT included here. It is only
    # lazy-imported inside utils/whisper_helpers.py (never at module scope),
    # so it is not required for test collection. Its dependency chain (numba
    # -> llvmlite 0.36.0) does not build on this dev machine's Python 3.14
    # (llvmlite 0.36.0 requires Python <3.10), and it also pulls in torch +
    # ~1.5GB of CUDA wheels. It remains installed in the Docker runtime via
    # docker-compose.yml's _PIP_ADDITIONAL_REQUIREMENTS (unchanged, separate
    # mechanism, likely an older Python there). If local whisper-model
    # execution is ever needed outside Docker, add it as an optional
    # dependency group instead of the default runtime group.
    "rapidfuzz>=3.14.5",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-cov>=4.1,<5.0",
    "pytest-mock>=3.12,<4.0",
    "pytest-xdist>=3.5,<4.0",
    "freezegun>=1.4,<2.0",
    "coverage[toml]>=7.4,<8.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "ruff==0.16.5",
]

[tool.uv]
package = false

[tool.ruff]
# Ruff config for airflow-dags (issue #269). Gated by .github/workflows/lint.yml.
# target-version is deliberately OMITTED: inferred from [project] requires-python
# (">=3.12"). Do not add it back — the split source of truth is what drifted to py311.
line-length = 120  # measured on a4f5377: 88 -> 2993 E501, 120 -> 80, 140 -> 22.
extend-exclude = ["openspec"]  # non-Python SDD/docs tree; defensive no-op today (no .py files).

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # mccabe complexity (C901) — backlog owned by issue #272
    "SIM",  # flake8-simplify
]
ignore = []  # no rule is globally disabled; debt lives in per-file-ignores below.

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
# Declared AND gated (issue #391): the whole repo was formatted once and CI
# now blocks drift via the "Ruff format (blocking)" step in lint.yml. Only
# these two keys are set — the shape is locked by
# TestRuffFormatConfig.test_format_block_declares_only_the_two_gated_keys.
quote-style = "double"
indent-style = "space"

# --- ruff baseline: generated, do not edit by hand ---
# Generated from dev tip b5260d7 with ruff 0.16.5 by scripts/gen_ruff_baseline.py.
# Regenerate/verify:
#   uv run ruff check . --no-cache --output-format json \
#     --config 'lint.per-file-ignores = { "__init__.py" = ["F401"] }' \
#     | uv run python scripts/gen_ruff_baseline.py --check
