networks:
  postgres_infra_network:
    external: true
  airflow_network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.50.0/24
          gateway: 192.168.50.1
  whisper_network:
    external: true
  ml_api_network:
    external: true
    name: ml-apis_ml_api_network

volumes:
  airflow_logs:
  airflow_plugins:
  git_dags:
  airflow_data:

x-airflow-common:
  &airflow-common
  # Custom Airflow image with ffmpeg and Deno support (required for yt-dlp YouTube)
  # Build with: docker build -t my-airflow:latest .
  image: my-airflow:latest
  restart: unless-stopped
  environment:
    # LocalExecutor allows parallel task execution (required for triggering other DAGs)
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    # Database connection (uses AIRFLOW_DB_NAME from .env: airflow_dev_db or airflow_db)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD must be set in .env}@postgres_shared:5432/${AIRFLOW_DB_NAME:-airflow_db}
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW__CORE__FERNET_KEY}"
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_SECRET_KEY}"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    # Installed packages
    _PIP_ADDITIONAL_REQUIREMENTS: "apache-airflow-providers-postgres openai beautifulsoup4 requests urllib3 google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client Pillow PyPDF2 yt-dlp pytubefix openai-whisper webrtcvad-wheels rapidfuzz"

    # DAG folder and performance tweaks
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags/repo
    AIRFLOW__CORE__PARALLELISM: 4
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 3
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 2
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Madrid

    # ✅ Reduce scheduler CPU usage
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 120
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 120

    # API keys
    OPENAI_API_KEY: "${OPENAI_API_KEY}"
    YOUTUBE_API_KEY: "${YOUTUBE_API_KEY}"
    REAP_API_KEY: "${REAP_API_KEY}"
    PIKZELS_API_KEY: "${PIKZELS_API_KEY:-}"

    # LLM model tiers (utils/llm_config.py) — empty falls back to committed defaults
    LLM_DEFAULT: "${LLM_DEFAULT:-}"
    LLM_CHEAP: "${LLM_CHEAP:-}"

    # PostgreSQL connection for your project
    POSTGRES_HOST: "${POSTGRES_HOST}"
    POSTGRES_PORT: "${POSTGRES_PORT}"
    POSTGRES_DB: "${POSTGRES_DB}"
    POSTGRES_USER: "${POSTGRES_USER}"
    POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    POSTGRES_SCHEMA: "${POSTGRES_SCHEMA}"
    # Dedicated DDL role for run_migrations (issue #203); empty default keeps
    # the fallback to POSTGRES_USER/PASSWORD in utils/migrations_dag.py active.
    MIGRATION_POSTGRES_USER: "${MIGRATION_POSTGRES_USER:-}"
    MIGRATION_POSTGRES_PASSWORD: "${MIGRATION_POSTGRES_PASSWORD:-}"

    # Git sync credentials (for git_sync DAG)
    GITHUB_USER: "${GITHUB_USER}"
    GITHUB_TOKEN: "${GITHUB_TOKEN}"
    GITHUB_REPO: "${GITHUB_REPO}"
    GIT_SYNC_BRANCH: "${GIT_SYNC_BRANCH:-dev}"
    # GIT_ASKPASS backs authentication for a tokenless remote URL (issue #207).
    # /opt/airflow/dags/.git-askpass.sh is one level ABOVE
    # AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags/repo, so DagBag never scans
    # it and `git reset --hard` in the repo worktree never clobbers it.
    GIT_ASKPASS: /opt/airflow/dags/.git-askpass.sh
    GIT_TERMINAL_PROMPT: "0"
  volumes:
    - airflow_logs:/opt/airflow/logs
    - airflow_plugins:/opt/airflow/plugins
    - git_dags:/opt/airflow/dags
    - airflow_data:/opt/airflow/data
    # Mount congress_videos directory from NAS (includes token, assets, videos, fonts)
    # Note: Token file must be writable for auto-refresh
    - /volume1/docker/airflow/congress_videos:/opt/airflow/data/congress_videos
  networks:
    - postgres_infra_network
    - airflow_network
    - whisper_network
    - ml_api_network
  dns:
    - 8.8.8.8
    - 1.1.1.1
  mem_limit: 1.5g
  mem_reservation: 1g

services:
  init-dags:
    image: alpine/git:latest
    container_name: airflow-init-dags-dev
    restart: "no"
    entrypoint: ""
    command:
      - sh
      - -c
      - |
        set -e
        printf '#!/bin/sh\nexec echo "$$GITHUB_TOKEN"\n' > /dags/.git-askpass.sh
        chmod 0700 /dags/.git-askpass.sh
        export GIT_ASKPASS=/dags/.git-askpass.sh GIT_TERMINAL_PROMPT=0
        REMOTE="https://$$GITHUB_USER@github.com/$$GITHUB_USER/$$GITHUB_REPO.git"
        git config --global --add safe.directory /dags/repo
        if [ -d /dags/repo/.git ]; then
          cd /dags/repo && git remote set-url origin "$$REMOTE" \
            && git fetch origin && git reset --hard "origin/$$GIT_SYNC_BRANCH"
        else
          git clone --depth 1 --branch "$$GIT_SYNC_BRANCH" "$$REMOTE" /dags/repo
        fi
    environment:
      GITHUB_USER: "${GITHUB_USER}"
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      GITHUB_REPO: "${GITHUB_REPO}"
      GIT_SYNC_BRANCH: "${GIT_SYNC_BRANCH:-dev}"
    volumes:
      - git_dags:/dags
    networks:
      - postgres_infra_network
      - airflow_network
      - whisper_network
    dns:
      - 8.8.8.8
      - 1.1.1.1

  init-perms:
    image: busybox
    container_name: airflow-init-perms-dev
    restart: "no"
    depends_on:
      init-dags:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - |
        chown -R 50000:0 /dags
        chown -R 50000:0 /data
        chown -R 50000:0 /congress_videos
        chmod -R 755 /congress_videos/assets
        chmod -R u=rwX,go= /congress_videos/youtube_tokens
        chmod -R 775 /congress_videos/videos
    volumes:
      - git_dags:/dags
      - airflow_data:/data
      - /volume1/docker/airflow/congress_videos:/congress_videos

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver-dev
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      init-perms:
        condition: service_completed_successfully
    ports:
      - "8081:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler-dev
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      init-perms:
        condition: service_completed_successfully
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init-dev
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # Initialize the database (creates tables if they don't exist)
        airflow db init

        # Run migrations to ensure schema is up to date
        airflow db migrate
    user: "50000:50000"