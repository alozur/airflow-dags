name: Lint

# Blocking ruff gate for the dev integration branch (issue #269).
# Unlike pip-audit.yml this workflow is NOT informational: a non-zero
# `ruff check` fails the check. Rule set, line length and the grandfathered
# per-file-ignores baseline all live in pyproject.toml. No --fix in CI.
#
# `ruff format --check` is also blocking (issue #391): the whole repo was
# formatted once and CI now guards against drift. Job name stays "ruff
# check" — it is a REQUIRED status check on the dev branch ruleset; never
# rename it.

on:
  pull_request:
    branches: [dev]
  push:
    # main is included so the release merge commit carries a passing "ruff check":
    # the main->dev sync is a fast-forward push of that same sha, which the dev
    # ruleset (required status checks) accepts without any bypass.
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install the dev dependency group (ruff version comes from uv.lock)
        run: uv sync --frozen --only-group dev

      - name: Ruff lint (blocking)
        run: uv run --no-sync ruff check --output-format=github .

      - name: Ruff format (blocking)
        # Fix locally with: uv run ruff format .
        run: uv run --no-sync ruff format --check .

      - name: Ruff baseline drift (blocking, remove-only)
        # Two steps, not a pipe, on purpose: this ruff run legitimately exits 1
        # (it reports every grandfathered violation by design), and the default
        # shell is `bash -e {0}` WITHOUT pipefail — a pipe would hide a genuine
        # ruff crash (exit >= 2) behind the script's own exit code.
        run: |
          rc=0
          uv run --no-sync ruff check . --no-cache --output-format json \
            --config 'lint.per-file-ignores = { "__init__.py" = ["F401"] }' \
            > "$RUNNER_TEMP/ruff-baseline.json" || rc=$?
          if [ "$rc" -ge 2 ]; then
            echo "::error::ruff exited $rc (operational failure, not a lint finding)"
            exit "$rc"
          fi
          uv run --no-sync python scripts/gen_ruff_baseline.py --check-remove-only \
            < "$RUNNER_TEMP/ruff-baseline.json"
